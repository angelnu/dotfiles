#cloud-config
# Proxmox cloud-init user-data for a fresh Ubuntu Server 24.04 LTS VM, to be
# followed by an interactive `chezmoi init --apply angelnu/dotfiles` (see
# cloud-init/README.md). NOT applied by chezmoi itself - excluded via
# .chezmoiignore, since this provisions the VM *before* chezmoi exists on it.
#
# Ubuntu 24.04+ specifically: Homebrew 6.0+ requires glibc 2.39+, which rules
# out older Ubuntu/Debian releases (they'd fail bottle installs or force
# from-source builds for everything).

hostname: dotfiles-server
timezone: UTC

users:
  - name: angel
    gecos: "Angel Nunez Mencias"
    # No "networkmanager": Ubuntu Server uses netplan, not NetworkManager,
    # by default - that group likely doesn't exist on this image, and
    # adding a user to a nonexistent group fails cloud-init outright.
    # No "docker" here either, for the same reason: it doesn't exist until
    # Docker is installed in runcmd below, which runs after this - added via
    # usermod there instead.
    groups: [sudo]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys:
      # Keep in sync with private_dot_ssh/*.pub in the dotfiles repo - all
      # public, safe to commit/embed. Trim to just the key(s) you actually
      # want able to log into this VM.
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMo5WSbzKExEfFp/wGAtdPuzI0Fp0TDryLP1MZ61XgHd angel@nix"
      - "ssh-rsa  ansible_phoenix"
      - "ssh-rsa "

# Explicit rather than relying on the image's default: guarantees SSH access
# regardless of what a given cloud image ships with.
packages:
  - openssh-server
  # Homebrew-on-Linux's own documented prerequisites:
  # https://docs.brew.sh/Homebrew-on-Linux
  - build-essential
  - procps
  - curl
  - file
  - git
package_update: true

ssh_pwauth: false
disable_root: true

runcmd:
  - systemctl enable --now ssh

  # Docker Engine + Compose plugin, via Docker's official apt repo rather
  # than Ubuntu's own "docker.io" package (typically older, and lacks the
  # compose plugin). Matches the old nix config's `extraGroups = [ "docker" ]`.
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
      > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker angel

  # Pre-seed the non-secret chezmoi init prompts (role/prune) so only the
  # age private key remains an interactive step. promptChoiceOnce/
  # promptBoolOnce read from this [data] section instead of prompting when
  # a value's already present - verified this against the real template
  # before relying on it here.
  - install -d -m 700 -o angel -g angel /home/angel/.config/chezmoi
  - |
    cat > /home/angel/.config/chezmoi/chezmoi.toml <<'EOF'
    [data]
        role = "default"
        prune = true
    EOF
  - chown angel:angel /home/angel/.config/chezmoi/chezmoi.toml
  - chmod 600 /home/angel/.config/chezmoi/chezmoi.toml

final_message: |
  cloud-init done after $UPTIME seconds.
  SSH in as angel and run:
    sh -c "$(curl -fsLS get.chezmoi.io)" -- init --apply angelnu/dotfiles
  It'll only prompt for the age private key - role and prune are already
  answered.
