packages:
  # Ordered role -> package type -> os. "default" always applies; the rest
  # (server/gui/gaming/develop/work) are independent tags selected at
  # `chezmoi init` (see .chezmoi.toml.tmpl, [data] roles) - a machine can
  # have any combination, or none. Each bucket is a positive "install this
  # when the tag is present" rule, no negation (e.g. what used to be
  # "non_server" is now "gui": selected on every desktop machine instead
  # of implied by the absence of "server"). os is any-os/darwin/linux -
  # "any-os" applies to both.
  # See .chezmoitemplates/{merged-packages,role-buckets,resolved-packages}
  # for how this gets merged with a per-user overlay and flattened.
  default:
    taps:
      any-os:
        - angelnu/pinned  # needed for angelnu/pinned/juju (angel's per-user
                          # overlay, role "default") - version-pinned formulae

    brews:
      any-os:
        # --- dotfiles baseline (not from the old nix config) ---
        - ripgrep
        - fzf
        - htop
        - chezmoi         # this tool itself, so `chezmoi update` keeps working
        - gh               # GitHub CLI - not needed by anything in this repo,
                           # just generally useful (e.g. creating repos via Claude Code)
        - jq               # CLI JSON processor
        - fish             # login shell, see dot_config/fish/config.fish.tmpl
        - vim              # was "programs.vim" in nix, see dot_vimrc

        # --- secrets ---
        - sops
        - age              # also used as chezmoi's own encryption backend, see .chezmoi.toml.tmpl
        - gnupg            # kept for tools that still expect gpg on PATH
        - bitwarden-cli    # `bw` CLI; separate from the "bitwarden" desktop cask below

        # --- vpn ---
        - openvpn
        - openfortivpn

        # --- Others ---
        - git              # so it's newer than the OS-bundled version; needed for
                           # this repo itself, not just development work
        - screen
        - wget
        - yq               # YAML/JSON processor; scripts/edit-*-secret.sh need this
                           # for every user, not just develop-tagged ones
        - dos2unix         # convert DOS line endings to Unix
        - openssh          # newer than the OS-bundled version
        - cairo            # 2D graphics library, dependency for some tools
        - ollama           # run/manage local LLMs
        - direnv           # per-directory env loading
        - qpdf             # merge/encrypt PDFs
      darwin:
        - mas
      linux:
        - procps           # ps/top/free (GNU versions); mac already has native tools
        - keychain         # ssh-agent front-end; mac already covered by osxkeychain credential helper

  gui:                  # installed on every machine with a desktop
    mas:                  # macOS App Store apps (darwin only)
      any-os:
        - name: Brother P-touch Editor
          id: 1453365242
        - name: iMovie
          id: 408981434
        - name: IPCams
          id: 1045600272
        - name: WireGuard    # GUI counterpart to the wireguard-tools CLI (develop)
          id: 1451685025
    rpm_ostree:   # layered packages for rpm-ostree hosts (Fedora Atomic / Bazzite);
                  # ignored on non-rpm-ostree hosts, and only on a desktop
                  # (nextcloud-client-dolphin needs Dolphin, a GUI app). See
                  # .chezmoiscripts/run_onchange_after_21-rpm-ostree.sh.tmpl
      any-os:
        - nextcloud-client
        - nextcloud-client-dolphin  # real Dolphin overlay-icon integration; the
                                    # flatpak can't provide this (sandboxed)
    casks:                # macOS GUI apps
      any-os:
        # --- dotfiles baseline (not from the old nix config) ---
        - wezterm
        - brave-browser
        - claude           # Claude Desktop; no Linux flatpak available, mac-only

        # --- Others ---
        - slack
        - discord
        - openscad          # programmable 3D CAD
        - dosbox-x-app       # DOS emulator
        - wireshark-app       # network protocol analyzer
        - bitwarden          # password manager
        - nextcloud          # Nextcloud desktop sync client
        - signal              # private messenger
        - whatsapp            # official desktop client (mac-only; no official Linux
                               # client exists, see ZapZap flatpak below)
    flatpaks:            # Linux GUI apps (system-wide, from flathub)
      any-os:
        # --- dotfiles baseline (not from the old nix config) ---
        - org.videolan.VLC             # VLC media player
        - com.brave.Browser            # Brave browser
        - org.mozilla.thunderbird_esr  # email client
        - com.prusa3d.PrusaSlicer      # 3D printer slicer
        - org.freecad.FreeCAD          # parametric 3D CAD
        - io.github.pwr_solaar.solaar    # Logitech peripherals manager
        # - org.kde.discover               # KDE software center
        - org.kde.filelight              # disk usage visualizer
        - org.kde.gwenview               # image viewer
        - org.kde.haruna                 # video player
        - org.kde.kcalc                  # calculator
        - org.kde.okular                 # document/PDF viewer
        - org.onlyoffice.desktopeditors  # office suite

        # --- Others ---
        - com.slack.Slack        # team chat
        - com.discordapp.Discord  # voice/chat
        - org.openscad.OpenSCAD  # programmable 3D CAD
        - com.dosbox_x.DOSBox-X  # DOS emulator
        - org.wireshark.Wireshark  # network protocol analyzer
        - com.bitwarden.desktop  # password manager
        - org.signal.Signal      # private messenger
        - com.rtosta.zapzap  # ZapZap; unofficial WhatsApp Web wrapper - WhatsApp
                             # has no official Linux client
        # nextcloud-client intentionally NOT here: the flatpak
        # (com.nextcloud.desktopclient.nextcloud) doesn't integrate with Dolphin's
        # overlay icons. Layered instead via the rpm_ostree bucket above (also
        # under "gui"), on hosts that support it.

  gaming:   # merged in only when the "gaming" tag is selected (Bazzite)
    flatpaks:
      any-os:
        - app.xemu.xemu                        # original Xbox emulator
        - com.github.Matoking.protontricks      # Proton prefix helper for Steam games
        - com.supermodel3.Supermodel            # Sega Model 3 arcade emulator
        - com.vysp3r.ProtonPlus                 # Proton/Wine compatibility tool manager
        - io.github.ilya_zlobintsev.LACT        # Linux AMD GPU control (overclock/fan)
        - io.github.shiiion.primehack           # Dolphin fork with VR mods (Metroid Prime)
        - io.github.wivrn.wivrn                 # VR headset streaming server
        - it.mq1.TinyWiiBackupManager           # Wii game backup manager
        - net.davidotek.pupgui2                 # ProtonUp-Qt; installs Proton-GE/Wine-GE
        - net.kuribo64.melonDS                  # Nintendo DS emulator
        - org.DolphinEmu.dolphin-emu            # GameCube/Wii emulator
        - org.libretro.RetroArch                # multi-system emulator frontend
        - org.mamedev.MAME                      # arcade machine emulator
        - org.ppsspp.PPSSPP                     # PSP emulator
        - org.scummvm.ScummVM                   # classic point-and-click adventure engine

  develop:   # merged in only when the "develop" tag is selected
    taps:
      any-os:
        - fluxcd/tap      # needed for fluxcd/tap/flux below
        - hashicorp/tap   # needed for hashicorp/tap/vault and .../terraform below
    mas:
      any-os:
        - name: CrystalFetch  # Windows ISO downloader/VM tool
          id: 6454431289
    brews:
      any-os:
        # --- Kubernetes ---
        - kubectl
        - helm             # was "kubernetes-helm" in nix
        - fluxcd/tap/flux  # was "fluxcd" in nix - NOT plain "flux" (homebrew core's
                           # "flux" is unrelated: InfluxData's query language)
        - openshift-cli    # was "openshift" in nix; provides the `oc` CLI

        # --- npm ---
        - node             # was "nodejs" in nix; corepack ships bundled with node

        # --- development ---
        - pre-commit       # manage git pre-commit hooks
        - go-task          # was "go-task" in nix; task runner/build tool (Taskfile)
        - docker           # was "docker-client" in nix; CLI only, no daemon/engine bundled
        - make             # was "gnumake" in nix
        - act              # run GitHub Actions locally
        - wireguard-tools
        - podman
        - hashicorp/tap/vault     # HashiCorp Vault

        # --- Python (was python3.withPackages in nix) ---
        - python3          # tracks Homebrew's current default python@X.Y
        - pipx             # install/run Python CLIs in isolated envs
        - uv               # fast Python package/venv manager
        - tox              # Python test-environment runner

        # --- Java ---
        - maven
        - openjdk          # was "jdk" in nix

        # --- cloud ---
        - ansible

        # --- Others ---
        - postgresql
        - minio-mc         # was "minio-client" in nix; S3-compatible object storage CLI

        # --- terraform ---
        - hashicorp/tap/terraform
        - openssl          # needed to encrypt HPVS contracts

        # --- Go  ---
        - go
    casks:
      any-os:
        - visual-studio-code
        - postman          # API development GUI
        - drawio           # diagramming tool
        - android-platform-tools  # was "android-tools" in nix; adb/fastboot.
                                  # No longer a formula (homebrew migrated it to
                                  # a cask); no Linux equivalent, so mac-only now.
        - rancher          # Rancher Desktop; container/Kubernetes management
        - utm              # QEMU-based VM UI
    flatpaks:
      any-os:
        - com.getpostman.Postman     # API development GUI
        - com.jgraph.drawio.desktop  # diagramming tool
        - org.virt_manager.virt-manager  # libvirt/QEMU VM manager

  work:   # merged in only when the "work" tag is selected
    mas:
      any-os:
        # --- iWork ---
        - name: Keynote
          id: 409183694
        - name: Pages
          id: 409201541
        - name: Numbers
          id: 361304891

        # --- Microsoft Office ---
        - name: Microsoft Word
          id: 462054704
        - name: Microsoft Excel
          id: 462058435
        - name: Microsoft PowerPoint
          id: 462062816
        - name: Microsoft OneNote
          id: 784801555
        - name: Microsoft Outlook
          id: 985367838
        - name: OneDrive
          id: 823766827
