# Non-secret environment variables common to every user, on top of each
# user's own overlay in env-<username>.yaml (key env_per_user_<username>
# there, not per_user_<username> - see that file's comment for why). See
# .chezmoitemplates/resolved-env for how they combine and
# dot_config/fish/modify_config.fish.tmpl / modify_dot_bashrc.tmpl /
# modify_dot_profile.tmpl for where they actually get exported.
#
# This file is plaintext and public - for anything secret (API keys,
# tokens, credentials) use the per-user env in the encrypted
# .chezmoisecrets/users.yaml.age instead (edit with
# scripts/edit-users-secret.sh), not here.
env: {}
