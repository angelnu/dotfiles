# Non-secret environment variables: "common" applies to every user,
# "users.<name>" is that user's own overlay on top (wins on a key
# collision - see .chezmoitemplates/resolved-env). One file for
# everyone, same shape as the encrypted per-user env in
# .chezmoisecrets/users.yaml.age (users.<name>.env there) - consolidated
# from 3 separate files (env.yaml + env-angel.yaml + env-mireille.yaml)
# into this one, for the same reason that one is a single file rather
# than per-user secrets: everything for "env vars, per user" belongs
# together, not scattered.
#
# This file is plaintext and public - for anything secret (API keys,
# tokens, credentials) use the per-user env in the encrypted
# .chezmoisecrets/users.yaml.age instead (edit with
# scripts/edit-users-secret.sh), not here. A literal "$HOME" in any
# value is resolved to this machine's actual home directory - see
# resolved-env - since this file itself is NOT a template (confirmed
# the hard way: chezmoi doesn't render .chezmoidata/*.yaml).
env:
  common:
    OPENCODE_CONFIG: "$HOME/code/opencode-agents/opencode.json"
    OPENCODE_CONFIG_DIR: "$HOME/code/opencode-agents/.opencode"
  users:
    angel: {}
    mireille: {}
